[project]
name = "patas-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andre", email = "a.martimpinho@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
patas-backend = "patas_backend:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Helpers shared by every kind of test (token issuer, adoption factory).
pythonpath = ["tests/support"]
addopts = "--strict-markers"
# Applied by tests/conftest.py from the folder a test lives in.
markers = [
    "unit: no database, network or app",
    "integration: uses a real database, a socket or the app",
    "acceptance: one acceptance test (AT) of the product, through HTTP",
]

# What is measured is code with logic (docs/process/TESTING.md): wiring and start-up
# have no rules of their own to break.
[tool.coverage.run]
branch = true
source = ["src/patas_backend"]
omit = [
    "*/__init__.py",
    "*/main.py",
    "*/database.py",
    "*/config.py",
    "*/routers/health.py",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Mutation testing of the domain (docs/process/TESTING.md): the unit tests run against
# changed copies of the code. Repositories are persistence, covered by integration tests.
# The whole package is copied because the tests import it; do_not_mutate narrows it.
[tool.mutmut]
source_paths = ["src/patas_backend/"]
do_not_mutate = [
    "src/patas_backend/auth/*",
    "src/patas_backend/routers/*",
    "src/patas_backend/services/*",
    "src/patas_backend/config.py",
    "src/patas_backend/database.py",
    "src/patas_backend/main.py",
    "src/patas_backend/demo_applications.py",
    "*/__init__.py",
    "*/repository.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["tests", "alembic.ini", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "diff-cover>=9.2.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.1",
]
